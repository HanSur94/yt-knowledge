<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}yt-k{% endblock %}</title>
<style>
:root{
  --paper:#EDEEEB; --ink:#17191B; --muted:#5C6167;
  --rule:rgba(23,25,27,.14); --soft:rgba(23,25,27,.07);
  --glass:rgba(246,247,245,.68); --focus:#2B5BD7;
  --ready:#3E6B4F; --wait:#7A5710; --fail:#8C3A2E; --quiet:#787D83;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --serif:"New York",Georgia,ui-serif,Cambria,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 var(--mono);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

/* chrome floats over the archive; glass is for chrome only, never decoration */
header{position:sticky;top:0;z-index:20;display:flex;align-items:baseline;gap:1.6rem;
  padding:.8rem max(1.6rem,calc((100% - 1088px)/2));background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--rule);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
header .brand{font-size:14px;font-weight:600;letter-spacing:-.01em}
header nav{display:flex;gap:1.3rem;margin-left:auto}
header a{color:#4E5359;font-size:13px}
header a:hover{color:var(--ink)}
header a[aria-current]{color:var(--ink)}

main{max-width:1140px;margin:0 auto;padding:2.2rem 1.6rem 6rem}

h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.012em}
h1{font-size:clamp(25px,3.2vw,34px);line-height:1.16;max-width:26ch}
h2{font-size:21px;line-height:1.25}
h3{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted);
  margin:2.2rem 0 .7rem;letter-spacing:.01em}
p{margin:0 0 .9rem;max-width:70ch}
ul{padding-left:1.1rem;margin:.4rem 0 1rem}
li{margin:.3rem 0;max-width:70ch}

/* reading surface: serif, 68ch, room to breathe */
.prose{font-family:var(--serif);font-size:18px;line-height:1.62;letter-spacing:-.003em}
.prose p,.prose li{max-width:68ch}
.lede{font-family:var(--serif);font-size:19px;line-height:1.5;font-weight:600;
  letter-spacing:-.008em;margin:0 0 1rem;max-width:60ch}

.meta{display:flex;flex-wrap:wrap;gap:.35rem 1.1rem;font-size:12.5px;color:var(--muted)}
.job{margin:1rem 0 0;max-width:420px}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .6s ease}
.dim{color:var(--muted)}
.num{text-align:right;white-space:nowrap;color:var(--muted)}
.error{color:var(--fail)}
.ts{color:var(--muted);font-variant-numeric:tabular-nums;
  text-decoration:underline;text-decoration-color:var(--soft);text-underline-offset:2px}
.ts:hover{color:var(--ink);text-decoration-color:var(--rule)}
a.link{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
a.link:hover{text-decoration-color:var(--ink)}

/* the archive: frames in rows, hairlines instead of cards */
.list{border-top:1px solid var(--rule);margin-top:1.2rem}
.row{display:flex;gap:1.1rem;align-items:flex-start;padding:.7rem .3rem;
  border-bottom:1px solid var(--soft)}
.row:hover{background:rgba(255,255,255,.5)}
.frame{flex:0 0 132px;aspect-ratio:16/9;border-radius:4px;overflow:hidden;
  background:rgba(23,25,27,.09);border:1px solid var(--soft)}
.frame{position:relative}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame.empty::after{content:"";position:absolute;inset:0;margin:auto;width:0;height:0;
  border-left:7px solid rgba(23,25,27,.16);border-top:5px solid transparent;
  border-bottom:5px solid transparent}
/* timestamped notes: the stamp is a rail, wrapped text hangs under the text */
.notes{list-style:none;padding:0;margin:.5rem 0 1.2rem;font-family:var(--serif)}
.notes li{display:grid;grid-template-columns:3.2rem 1fr;gap:.7rem;margin:.55rem 0;
  font-size:17.5px;line-height:1.55;max-width:68ch}
.notes .ts{font-family:var(--mono);font-size:12.5px;padding-top:.3rem;justify-self:end}
.notes.small li{font-size:16px;margin:.4rem 0}
.body{flex:1;min-width:0}
.title{font-family:var(--serif);font-size:16.5px;line-height:1.35;font-weight:500;
  letter-spacing:-.006em;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.72em}
.row:hover .title{text-decoration:underline;text-decoration-color:var(--rule);
  text-underline-offset:2px}
.state{flex:0 0 auto;font-size:12.5px;white-space:nowrap;padding-top:.2rem}
.s-ready,.s-fetched{color:var(--ready)}
.s-pending,.s-running{color:var(--wait)}
.s-failed{color:var(--fail)}
.s-archived,.s-no_caption{color:var(--quiet)}

/* forms */
input,select,textarea{height:2.4rem;background:rgba(255,255,255,.72);border:1px solid var(--rule);
  color:var(--ink);padding:.52rem .68rem;border-radius:7px;font:inherit;font-size:13.5px;
  font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
input:focus,select:focus{outline:none;border-color:var(--focus);
  box-shadow:0 0 0 3px rgba(43,91,215,.14)}
button{display:inline-flex;align-items:center;background:rgba(255,255,255,.8);
  color:var(--ink);border:1px solid var(--rule);line-height:1.35;
  padding:.52rem .95rem;border-radius:7px;font:inherit;font-size:13.5px;cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button:hover{border-color:rgba(23,25,27,.3);background:#fff}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:.3rem}

/* tables: watch log, chapters */
table{width:100%;border-collapse:collapse;margin:.4rem 0 1rem}
th,td{text-align:left;padding:.42rem .6rem .42rem 0;border-bottom:1px solid var(--soft);
  vertical-align:top}
th{font-weight:500;font-size:12px;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums}
/* line-clamp only works on an inner block; a table cell ignores it */
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;max-width:34ch}

/* what is being processed right now: the one live thing on this page */
.now{border:1px solid var(--rule);border-radius:9px;padding:.55rem .85rem;margin:0 0 1.4rem;
  background:rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.now-row{display:flex;align-items:center;gap:.65rem}
.now-row+.now-row{margin-top:.45rem}
.now-title{font-family:var(--serif);font-size:16px;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.now-title:hover{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.now-elapsed{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wait);flex:0 0 auto;
  animation:pulse 1.8s ease-in-out infinite}
.dot.idle{background:var(--quiet);animation:none}
.dot.resting{background:var(--wait);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.4rem,1fr));
  gap:1.4rem;margin:1.4rem 0 1.8rem}
.stats div{display:flex;flex-direction:column;gap:.1rem}
.stats b{font-size:22px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stats b.zero{color:var(--quiet)}
.stats span{color:var(--muted);font-size:12px}

.hero{aspect-ratio:16/9;max-width:720px;border-radius:6px;overflow:hidden;
  background:rgba(23,25,27,.09);border:1px solid var(--soft);margin:1.2rem 0 1.4rem}
.hero img{width:100%;height:100%;object-fit:cover;display:block}

@media(max-width:640px){
  form{flex-wrap:wrap}
  input,button,select{max-width:100%}
  .meta{gap:.25rem .8rem}
  main{padding:1.4rem 1rem 4rem}
  header{padding:.75rem 1rem;gap:1rem;flex-wrap:wrap}
  header nav{gap:.9rem;margin-left:0}
  .frame{flex-basis:96px}
  .stats{gap:1.4rem}
  .prose{font-size:16.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<header><a class="brand" href="/">yt-k</a>
<nav><a href="/">library</a><a href="/queue">queue</a><a href="/settings">settings</a><a href="/digest">digest</a><a href="/logout">logout</a></nav></header>
<main>{% block body %}{% endblock %}</main>
</body></html>
